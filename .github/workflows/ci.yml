name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Finish an in-progress production publication before the next main run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Source checks
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  hosting:
    name: Build and validate public assets
    uses: ./.github/workflows/cloudflare-check.yml
    permissions:
      contents: read

  deploy-sites:
    name: Deploy production sites
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [check, hosting]
    uses: ./.github/workflows/cloudflare.yml
    with:
      artifact-id: ${{ needs.hosting.outputs.artifact-id }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    permissions:
      contents: read

  publish-image:
    name: Publish production Docker image
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [check, hosting]
    uses: ./.github/workflows/publish-image.yml
    with:
      channel: main
    permissions:
      contents: read
      packages: write
