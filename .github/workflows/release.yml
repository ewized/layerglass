name: Release image

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  publish:
    name: Publish versioned image
    needs: validate
    uses: ./.github/workflows/publish-image.yml
    with:
      channel: release
    permissions:
      contents: read
      packages: write
