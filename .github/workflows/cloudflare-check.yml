name: Public hosting checks

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'infra/cloudflare/**'
      - 'scripts/cloudflare.mjs'
      - 'scripts/build-static.mjs'
      - 'apps/web/**'
      - 'apps/site/**'
      - 'package*.json'
      - 'nx.json'
      - 'VERSION'
      - '.github/workflows/cloudflare*.yml'
  pull_request:
    paths:
      - 'infra/cloudflare/**'
      - 'scripts/cloudflare.mjs'
      - 'scripts/build-static.mjs'
      - 'apps/web/**'
      - 'apps/site/**'
      - 'package*.json'
      - 'nx.json'
      - 'VERSION'
      - '.github/workflows/cloudflare*.yml'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: hosting-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosting:
    name: Static apps and Cloudflare assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate public hosting without credentials
        run: |
          docker run --rm --init --name codex__layerglass_hosting_check__${{ github.run_id }} \
            --user "$(id -u):$(id -g)" -e npm_config_cache=/tmp/npm-cache \
            -e NX_DAEMON=false -e NX_NO_CLOUD=true -e WRANGLER_SEND_METRICS=false \
            -v "$PWD:/app" -w /app node:24-bookworm sh -ec '
              npm ci
              npx nx run-many -t build --projects=web,site
              npm --prefix infra/cloudflare ci
              npm --prefix infra/cloudflare test
              node scripts/cloudflare.mjs prepare all
              node scripts/cloudflare.mjs check all
              node scripts/cloudflare.mjs dry-run all
              npm --prefix infra/cloudflare run test:local
            '
