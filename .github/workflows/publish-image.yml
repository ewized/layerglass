name: Publish Docker image

on:
  workflow_call:
    inputs:
      channel:
        description: main for continuous delivery, release for a version tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish multi-architecture image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: image-publication-${{ inputs.channel }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select publication channel and image tags
        id: image
        env:
          IMAGE_CHANNEL: ${{ inputs.channel }}
          IMAGE_SOURCE_SHA: ${{ github.sha }}
          IMAGE_SOURCE_REF: ${{ github.ref }}
          IMAGE_SOURCE_TAG: ${{ github.ref_name }}
          IMAGE_REPOSITORY: ${{ github.repository }}
        run: |
          task_version=$(cat VERSION)
          [[ "$task_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          task_image="ghcr.io/${IMAGE_REPOSITORY,,}"
          case "$IMAGE_CHANNEL" in
            main) [[ "$IMAGE_SOURCE_REF" == refs/heads/main ]] || exit 1 ;;
            release) [[ "$IMAGE_SOURCE_TAG" == "v$task_version" && "$IMAGE_SOURCE_REF" == refs/tags/v* ]] || exit 1 ;;
            *) echo 'Unknown image publication channel' >&2; exit 1 ;;
          esac
          {
            echo "version=$task_version"
            echo "image=$task_image"
            echo 'tags<<LAYERGLASS_TAGS'
            if [[ "$IMAGE_CHANNEL" == main ]]; then
              echo "$task_image:sha-$IMAGE_SOURCE_SHA"
              echo "$task_image:latest"
            else
              echo "$task_image:$task_version"
              echo "$task_image:release-sha-$IMAGE_SOURCE_SHA"
              if [[ "$task_version" != *-* ]]; then echo "$task_image:stable"; fi
            fi
            echo 'LAYERGLASS_TAGS'
          } >> "$GITHUB_OUTPUT"
      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=layerglass-image
          cache-to: type=gha,mode=max,scope=layerglass-image
          provenance: mode=max
          sbom: true
      - name: Verify both published architectures and record rollback reference
        env:
          IMAGE_NAME: ${{ steps.image.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME@$IMAGE_DIGEST" --raw |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | contains(["amd64", "arm64"])'
          {
            echo '### Published Docker image'
            echo "Source: $SOURCE_SHA"
            echo "Exact rollback reference: $IMAGE_NAME@$IMAGE_DIGEST"
            echo 'Platforms: linux/amd64, linux/arm64'
          } >> "$GITHUB_STEP_SUMMARY"
