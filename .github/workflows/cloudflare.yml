name: Deploy public sites

on:
  workflow_call:
    inputs:
      artifact-id:
        description: Immutable validated artifact from this CI run
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Publish website and app
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    environment:
      name: cloudflare-production
      url: https://app.layer.glass
    steps:
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the cloudflare-production environment.' >&2
            exit 1
          fi
      - name: Check out the validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the validated public assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: dist/apps
      - name: Verify artifact and deploy both domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          docker run --rm --init --name codex__layerglass_cf_deploy__${{ github.run_id }} \
            --user "$(id -u):$(id -g)" -e npm_config_cache=/tmp/npm-cache \
            -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID \
            -e LAYERGLASS_REVISION="$GITHUB_SHA" -e WRANGLER_SEND_METRICS=false \
            -v "$PWD:/app" -w /app node:24-bookworm sh -ec '
              npm --prefix infra/cloudflare ci
              node scripts/delivery.ts verify "$LAYERGLASS_REVISION"
              node scripts/cloudflare.ts check all
              node scripts/cloudflare.ts deploy all
              node scripts/delivery.ts verify "$LAYERGLASS_REVISION"
            '
      - name: Verify deployed HTTPS, headers and exact asset bytes
        run: |
          docker run --rm --init --name codex__layerglass_cf_verify__${{ github.run_id }} \
            --user "$(id -u):$(id -g)" -e LAYERGLASS_REVISION="$GITHUB_SHA" \
            -v "$PWD:/app:ro" -w /app node:24-bookworm sh -ec '
              node scripts/cloudflare.ts verify all
              node scripts/delivery.ts published "$LAYERGLASS_REVISION"
            '
      - name: Record deployment
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo '### Production websites'
            echo "Source: $SOURCE_SHA"
            echo '- https://layer.glass'
            echo '- https://app.layer.glass'
            echo 'Published the validated CI artifact and verified its public entrypoint bytes.'
          } >> "$GITHUB_STEP_SUMMARY"
