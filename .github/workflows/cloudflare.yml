name: Deploy public sites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate deployment source
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  validate-hosting:
    name: Validate static hosting
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cloudflare-check.yml
    permissions:
      contents: read

  deploy:
    name: Publish website and demo app
    needs: [validate, validate-hosting]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cloudflare-production
    steps:
      - name: Check out tested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build, validate and dry-run static hosting
        run: |
          docker run --rm --init --name codex__layerglass_cf_build__${{ github.run_id }} \
            --user "$(id -u):$(id -g)" -e npm_config_cache=/tmp/npm-cache \
            -e NX_DAEMON=false -e NX_NO_CLOUD=true -e WRANGLER_SEND_METRICS=false \
            -v "$PWD:/app" -w /app node:24-bookworm sh -ec '
              npm ci
              npx nx run-many -t build --projects=web,site
              npm --prefix infra/cloudflare ci
              npm --prefix infra/cloudflare test
              node scripts/cloudflare.mjs prepare all
              node scripts/cloudflare.mjs check all
              node scripts/cloudflare.mjs dry-run all
            '
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'Configure both Cloudflare environment secrets before enabling deployments.' >&2
            exit 1
          fi
      - name: Deploy the two public domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          docker run --rm --init --name codex__layerglass_cf_deploy__${{ github.run_id }} \
            --user "$(id -u):$(id -g)" \
            -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID \
            -e WRANGLER_SEND_METRICS=false -v "$PWD:/app" -w /app \
            node:24-bookworm node scripts/cloudflare.mjs deploy all
      - name: Verify HTTPS, headers and static-only routing
        run: |
          docker run --rm --init --name codex__layerglass_cf_verify__${{ github.run_id }} \
            --user "$(id -u):$(id -g)" -v "$PWD:/app:ro" -w /app \
            node:24-bookworm node scripts/cloudflare.mjs verify all
